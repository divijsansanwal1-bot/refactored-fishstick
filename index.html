<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Pulse - Monitor & Alerts</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --green: #22c55e;
      --red: #ef4444;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; max-width: 600px; margin: 0 auto; padding-bottom: 40px; }

    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    h1 { font-size: 1.4rem; color: var(--accent); }
    
    .card { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); }
    .card-title { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 12px; }

    input, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: var(--text); font-size: 1rem; margin-bottom: 8px; outline: none; }
    input:focus { border-color: var(--accent); }
    button { background: var(--accent); color: #0f172a; font-weight: bold; cursor: pointer; border: none; transition: opacity 0.2s; }
    button:active { opacity: 0.8; }
    button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }

    .flex-group { display: flex; gap: 8px; }
    .flex-group input { margin-bottom: 0; }

    .stock-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .stock-item:last-child { border-bottom: none; }
    .stock-symbol { font-weight: bold; font-size: 1.1rem; }
    .stock-price { font-size: 1.1rem; font-weight: bold; text-align: right; }
    .stock-change { font-size: 0.85rem; text-align: right; }
    .up { color: var(--green); }
    .down { color: var(--red); }

    .alert-badge { font-size: 0.75rem; background: #334155; padding: 2px 6px; border-radius: 4px; margin-top: 4px; display: inline-block; color: var(--accent); }
    .alert-triggered { background: var(--red); color: white; animation: pulse 1s infinite alternate; }

    @keyframes pulse { from { opacity: 0.7; } to { opacity: 1; } }
    .hidden { display: none; }
  </style>
</head>
<body>

  <header>
    <h1>Stock Pulse</h1>
    <button class="secondary" style="width: auto; padding: 6px 12px; font-size: 0.85rem;" onclick="toggleSettings()">API Key</button>
  </header>

  <div id="settings-card" class="card">
    <div class="card-title">Finnhub API Key Setup</div>
    <input type="password" id="api-key-input" placeholder="Paste Finnhub API Key here">
    <button onclick="saveApiKey()">Save Key</button>
  </div>

  <div class="card">
    <div class="card-title">Track New Stock</div>
    <div class="flex-group" style="margin-bottom: 8px;">
      <input type="text" id="symbol-input" placeholder="Ticker (e.g. AAPL, TSLA)" style="text-transform: uppercase;">
      <input type="number" id="target-input" placeholder="Alert Price ($)" step="0.01">
    </div>
    <button onclick="addStock()">Add to Watchlist</button>
  </div>

  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <div class="card-title" style="margin:0;">Watchlist</div>
      <button class="secondary" style="width: auto; padding: 4px 8px; font-size: 0.75rem;" onclick="fetchAllPrices()">Refresh All</button>
    </div>
    <div id="watchlist">
      <div style="text-align: center; color: var(--text-muted); padding: 12px;">No stocks added yet.</div>
    </div>
  </div>

  <script>
    let apiKey = localStorage.getItem("finnhub_api_key") || "";
    let watchlist = JSON.parse(localStorage.getItem("stock_watchlist")) || [];

    // Initialize UI
    if (apiKey) {
      document.getElementById("settings-card").classList.add("hidden");
      document.getElementById("api-key-input").value = apiKey;
    }

    renderWatchlist();
    if (apiKey && watchlist.length > 0) {
      fetchAllPrices();
    }

    function saveApiKey() {
      const key = document.getElementById("api-key-input").value.trim();
      if (!key) return alert("Please enter a valid key");
      apiKey = key;
      localStorage.setItem("finnhub_api_key", key);
      document.getElementById("settings-card").classList.add("hidden");
      fetchAllPrices();
    }

    function toggleSettings() {
      const card = document.getElementById("settings-card");
      card.classList.toggle("hidden");
    }

    function addStock() {
      const symbolInput = document.getElementById("symbol-input");
      const targetInput = document.getElementById("target-input");
      
      const symbol = symbolInput.value.trim().toUpperCase();
      const targetPrice = parseFloat(targetInput.value);

      if (!symbol) return alert("Please enter a stock ticker.");

      const newStock = {
        symbol: symbol,
        targetPrice: targetPrice || null,
        currentPrice: null,
        change: null,
        alertTriggered: false
      };

      watchlist.push(newStock);
      saveWatchlist();
      symbolInput.value = "";
      targetInput.value = "";
      fetchPrice(symbol);
    }

    function removeStock(symbol) {
      watchlist = watchlist.filter(item => item.symbol !== symbol);
      saveWatchlist();
      renderWatchlist();
    }

    function saveWatchlist() {
      localStorage.setItem("stock_watchlist", JSON.stringify(watchlist));
    }

    async function fetchPrice(symbol) {
      if (!apiKey) {
        alert("Please enter your Finnhub API key first.");
        document.getElementById("settings-card").classList.remove("hidden");
        return;
      }

      try {
        const response = await fetch(`https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${apiKey}`);
        const data = await response.json();

        // c = current price, d = change
        if (data && data.c !== undefined && data.c !== 0) {
          const index = watchlist.findIndex(item => item.symbol === symbol);
          if (index !== -1) {
            watchlist[index].currentPrice = data.c;
            watchlist[index].change = data.d;

            // Check price alert condition
            if (watchlist[index].targetPrice) {
              if (data.c >= watchlist[index].targetPrice) {
                watchlist[index].alertTriggered = true;
              } else {
                watchlist[index].alertTriggered = false;
              }
            }

            saveWatchlist();
            renderWatchlist();
          }
        } else {
          alert(`Could not fetch data for ${symbol}. Verify ticker symbol or API key.`);
        }
      } catch (err) {
        console.error("Fetch error:", err);
      }
    }

    function fetchAllPrices() {
      watchlist.forEach(item => fetchPrice(item.symbol));
    }

    function renderWatchlist() {
      const container = document.getElementById("watchlist");
      if (watchlist.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 12px;">No stocks added yet.</div>`;
        return;
      }

      container.innerHTML = watchlist.map(stock => {
        const isUp = stock.change >= 0;
        const changeClass = isUp ? "up" : "down";
        const sign = isUp ? "+" : "";
        const priceDisplay = stock.currentPrice ? `$${stock.currentPrice.toFixed(2)}` : "Loading...";
        const changeDisplay = stock.change !== null ? `${sign}${stock.change.toFixed(2)}` : "";

        let alertHtml = "";
        if (stock.targetPrice) {
          const alertClass = stock.alertTriggered ? "alert-badge alert-triggered" : "alert-badge";
          const alertLabel = stock.alertTriggered ? `ALERT: Hit $${stock.targetPrice}` : `Target: $${stock.targetPrice}`;
          alertHtml = `<br><span class="${alertClass}">${alertLabel}</span>`;
        }

        return `
          <div class="stock-item">
            <div>
              <div class="stock-symbol">${stock.symbol}</div>
              <button onclick="removeStock('${stock.symbol}')" style="background:none; border:none; color:var(--red); font-size:0.75rem; padding:0; text-align:left; cursor:pointer;">Delete</button>
              ${alertHtml}
            </div>
            <div>
              <div class="stock-price">${priceDisplay}</div>
              <div class="stock-change ${changeClass}">${changeDisplay}</div>
            </div>
          </div>
        `;
      }).join("");
    }
  </script>
</body>
</html>
