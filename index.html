<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Pulse - Tracker & Alerts</title>
  <style>
    /* Color Palette Definitions */
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --green: #22c55e;
      --red: #ef4444;
      --border: #334155;
      --input-bg: #0f172a;
      --table-hover: #26334d;
    }

    /* Light Theme Overrides */
    [data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --accent: #0284c7;
      --text: #0f172a;
      --text-muted: #64748b;
      --green: #16a34a;
      --red: #dc2626;
      --border: #e2e8f0;
      --input-bg: #f1f5f9;
      --table-hover: #f1f5f9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; transition: background-color 0.2s, color 0.2s; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; max-width: 600px; margin: 0 auto; padding-bottom: 40px; }

    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    h1 { font-size: 1.4rem; color: var(--accent); }

    .header-actions { display: flex; gap: 8px; align-items: center; }
    
    .theme-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; gap: 6px; }

    .card { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); }
    .card-title { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 12px; font-weight: 600; }

    input, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); font-size: 1rem; margin-bottom: 8px; outline: none; }
    input:focus { border-color: var(--accent); }
    button { background: var(--accent); color: white; font-weight: bold; cursor: pointer; border: none; }
    button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }

    .flex-group { display: flex; gap: 8px; }
    .flex-group input { margin-bottom: 0; }

    /* Stock List */
    .stock-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .stock-item:last-child { border-bottom: none; }
    .stock-symbol { font-weight: bold; font-size: 1.1rem; }
    .stock-price { font-size: 1.1rem; font-weight: bold; text-align: right; }
    .stock-change { font-size: 0.85rem; text-align: right; }
    .up { color: var(--green); }
    .down { color: var(--red); }

    .alert-badge { font-size: 0.75rem; background: var(--border); padding: 2px 6px; border-radius: 4px; margin-top: 4px; display: inline-block; color: var(--accent); }
    .alert-triggered { background: var(--red); color: white; animation: pulse 1s infinite alternate; }

    /* Browse Table */
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th { color: var(--text-muted); font-weight: 600; padding: 8px 4px; border-bottom: 1px solid var(--border); }
    td { padding: 10px 4px; border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    tr:hover { background-color: var(--table-hover); }

    .add-btn { background: var(--accent); color: white; border: none; padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer; width: auto; margin: 0; }

    @keyframes pulse { from { opacity: 0.7; } to { opacity: 1; } }
    .hidden { display: none; }
  </style>
</head>
<body>

  <header>
    <h1>Stock Pulse</h1>
    <div class="header-actions">
      <button class="theme-btn" id="theme-toggle" onclick="toggleTheme()">☀️</button>
      <button class="secondary" style="width: auto; padding: 6px 12px; font-size: 0.85rem;" onclick="toggleSettings()">API Key</button>
    </div>
  </header>

  <div id="settings-card" class="card">
    <div class="card-title">Finnhub API Key Setup</div>
    <input type="password" id="api-key-input" placeholder="Paste Finnhub API Key here">
    <button onclick="saveApiKey()">Save Key</button>
  </div>

  <div class="card">
    <div class="card-title">Track Custom Stock</div>
    <div class="flex-group" style="margin-bottom: 8px;">
      <input type="text" id="symbol-input" placeholder="Ticker (e.g. NVDA)" style="text-transform: uppercase;">
      <input type="number" id="target-input" placeholder="Target Price ($)" step="0.01">
    </div>
    <button onclick="addStockFromInput()">Add Ticker</button>
  </div>

  <div class="card">
    <div class="card-title">Browse Famous Stocks</div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Ticker</th>
            <th>Company</th>
            <th>Sector</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="famous-stocks-body">
          </tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <div class="card-title" style="margin:0;">My Watchlist</div>
      <button class="secondary" style="width: auto; padding: 4px 8px; font-size: 0.75rem;" onclick="fetchAllPrices()">Refresh All</button>
    </div>
    <div id="watchlist">
      <div style="text-align: center; color: var(--text-muted); padding: 12px;">No stocks added yet.</div>
    </div>
  </div>

  <script>
    let apiKey = localStorage.getItem("finnhub_api_key") || "";
    let watchlist = JSON.parse(localStorage.getItem("stock_watchlist")) || [];
    let currentTheme = localStorage.getItem("app_theme") || "dark";

    // Curated Famous Stocks List
    const famousStocks = [
      { symbol: "AAPL", name: "Apple Inc.", sector: "Tech" },
      { symbol: "MSFT", name: "Microsoft", sector: "Tech" },
      { symbol: "GOOGL", name: "Alphabet (Google)", sector: "Tech" },
      { symbol: "AMZN", name: "Amazon", sector: "Commerce" },
      { symbol: "NVDA", name: "NVIDIA", sector: "Semiconductors" },
      { symbol: "TSLA", name: "Tesla", sector: "Automotive" },
      { symbol: "META", name: "Meta (Facebook)", sector: "Tech" }
    ];

    // Theme Management
    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      document.getElementById("theme-toggle").textContent = theme === "dark" ? "☀️" : "🌙";
      localStorage.setItem("app_theme", theme);
    }

    function toggleTheme() {
      currentTheme = currentTheme === "dark" ? "light" : "dark";
      applyTheme(currentTheme);
    }

    // Initialize App
    applyTheme(currentTheme);
    renderFamousStocksTable();

    if (apiKey) {
      document.getElementById("settings-card").classList.add("hidden");
      document.getElementById("api-key-input").value = apiKey;
    }

    renderWatchlist();
    if (apiKey && watchlist.length > 0) {
      fetchAllPrices();
    }

    function saveApiKey() {
      const key = document.getElementById("api-key-input").value.trim();
      if (!key) return alert("Please enter a valid key");
      apiKey = key;
      localStorage.setItem("finnhub_api_key", key);
      document.getElementById("settings-card").classList.add("hidden");
      fetchAllPrices();
    }

    function toggleSettings() {
      document.getElementById("settings-card").classList.toggle("hidden");
    }

    function renderFamousStocksTable() {
      const tbody = document.getElementById("famous-stocks-body");
      tbody.innerHTML = famousStocks.map(stock => `
        <tr>
          <td><strong>${stock.symbol}</strong></td>
          <td>${stock.name}</td>
          <td style="color: var(--text-muted);">${stock.sector}</td>
          <td>
            <button class="add-btn" onclick="addStock('${stock.symbol}')">+ Add</button>
          </td>
        </tr>
      `).join("");
    }

    function addStockFromInput() {
      const symbolInput = document.getElementById("symbol-input");
      const targetInput = document.getElementById("target-input");
      const symbol = symbolInput.value.trim().toUpperCase();
      const targetPrice = parseFloat(targetInput.value);

      if (!symbol) return alert("Please enter a stock ticker.");

      addStock(symbol, targetPrice);
      symbolInput.value = "";
      targetInput.value = "";
    }

    function addStock(symbol, targetPrice = null) {
      if (watchlist.some(item => item.symbol === symbol)) {
        return alert(`${symbol} is already in your watchlist!`);
      }

      const newStock = {
        symbol: symbol,
        targetPrice: targetPrice,
        currentPrice: null,
        change: null,
        alertTriggered: false
      };

      watchlist.push(newStock);
      saveWatchlist();
      renderWatchlist();
      fetchPrice(symbol);
    }

    function removeStock(symbol) {
      watchlist = watchlist.filter(item => item.symbol !== symbol);
      saveWatchlist();
      renderWatchlist();
    }

    function saveWatchlist() {
      localStorage.setItem("stock_watchlist", JSON.stringify(watchlist));
    }

    async function fetchPrice(symbol) {
      if (!apiKey) {
        document.getElementById("settings-card").classList.remove("hidden");
        return;
      }

      try {
        const response = await fetch(`https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${apiKey}`);
        const data = await response.json();

        if (data && data.c !== undefined && data.c !== 0) {
          const index = watchlist.findIndex(item => item.symbol === symbol);
          if (index !== -1) {
            watchlist[index].currentPrice = data.c;
            watchlist[index].change = data.d;

            if (watchlist[index].targetPrice) {
              watchlist[index].alertTriggered = data.c >= watchlist[index].targetPrice;
            }

            saveWatchlist();
            renderWatchlist();
          }
        }
      } catch (err) {
        console.error("Fetch error:", err);
      }
    }

    function fetchAllPrices() {
      watchlist.forEach(item => fetchPrice(item.symbol));
    }

    function renderWatchlist() {
      const container = document.getElementById("watchlist");
      if (watchlist.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 12px;">No stocks added yet.</div>`;
        return;
      }

      container.innerHTML = watchlist.map(stock => {
        const isUp = stock.change >= 0;
        const changeClass = isUp ? "up" : "down";
        const sign = isUp ? "+" : "";
        const priceDisplay = stock.currentPrice ? `$${stock.currentPrice.toFixed(2)}` : "Loading...";
        const changeDisplay = stock.change !== null ? `${sign}${stock.change.toFixed(2)}` : "";

        let alertHtml = "";
        if (stock.targetPrice) {
          const alertClass = stock.alertTriggered ? "alert-badge alert-triggered" : "alert-badge";
          const alertLabel = stock.alertTriggered ? `ALERT: Hit $${stock.targetPrice}` : `Target: $${stock.targetPrice}`;
          alertHtml = `<br><span class="${alertClass}">${alertLabel}</span>`;
        }

        return `
          <div class="stock-item">
            <div>
              <div class="stock-symbol">${stock.symbol}</div>
              <button onclick="removeStock('${stock.symbol}')" style="background:none; border:none; color:var(--red); font-size:0.75rem; padding:0; text-align:left; cursor:pointer;">Delete</button>
            </div>
            <div>
              <div class="stock-price">${priceDisplay}</div>
              <div class="stock-change ${changeClass}">${changeDisplay}</div>
              ${alertHtml}
            </div>
          </div>
        `;
      }).join("");
    }
  </script>
</body>
</html>
